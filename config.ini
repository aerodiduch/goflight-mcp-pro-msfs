; Restart the bridge after editing this file.

[general]
; log every button, knob and MCP change (same as --verbose)
verbose = no

[panel]
; display brightness 0..15, lower it if the panel acts up on a weak USB port
brightness = 15

[pmdg]
; set   = knobs send the exact value (recommended)
; wheel = knobs act like the mouse wheel on the virtual MCP
knob_mode = set
; wheel mode only: set to no if the knobs turn the wrong way
wheel_up_increases = yes
; pushing the HEADING knob: bank_angle or none
hdg_push = bank_angle

[steps]
; feet per ALTITUDE click
alt = 100
; optional extra acceleration: when a single report brings this many clicks or more,
; each click is worth alt_fast feet. 99 turns it off, the panel already accelerates.
alt_fast = 1000
alt_fast_threshold = 99
